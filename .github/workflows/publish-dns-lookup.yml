name: Publish dns-lookup to PyPI

on:
  push:
    branches:
      - main
    paths:
      - 'PROJECTS/beginner/dns-lookup/**'
      - '!PROJECTS/beginner/dns-lookup/README.md'
      - '!PROJECTS/beginner/dns-lookup/justfile'

permissions:
  contents: read

jobs:
  pypi-publish:
    name: Upload dns-lookup to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dnslookup-cli
    permissions:
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check if version exists on PyPI
        id: version_check
        working-directory: PROJECTS/beginner/dns-lookup
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/dnslookup-cli/${VERSION}/json")
          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::dnslookup-cli v${VERSION} already on PyPI — skipping publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::dnslookup-cli v${VERSION} not on PyPI — publishing"
          fi

      - name: Install uv
        if: steps.version_check.outputs.exists != 'true'
        uses: astral-sh/setup-uv@v10.3.3

      - name: Build package
        if: steps.version_check.outputs.exists != 'true'
        working-directory: PROJECTS/beginner/dns-lookup
        run: uv build

      - name: Publish to PyPI
        if: steps.version_check.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: PROJECTS/beginner/dns-lookup/dist/
