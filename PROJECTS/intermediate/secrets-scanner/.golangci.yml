# .golangci.yml

version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - gosec
    - bodyclose
    - nilerr
    - errorlint
    - exhaustive
    - gocritic
    - funlen
    - gocognit
    - dupl
    - goconst
    - ineffassign
    - unused
    - unconvert
    - unparam
    - testifylint
    - fatcontext

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - funlen
          - dupl
          - goconst
          - gosec
      - path: builtin\.go
        linters:
          - funlen
          - dupl
          - goconst
    paths:
      - vendor
      - testdata

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true

    funlen:
      lines: 120
      statements: 60

    gocognit:
      min-complexity: 25

    govet:
      enable-all: true
      disable:
        - fieldalignment

    gosec:
      excludes:
        - G104
        - G401
        - G505

issues:
  max-same-issues: 50

formatters:
  enable:
    - gci
    - gofumpt
    - golines
  settings:
    golines:
      max-len: 80
      reformat-tags: true
    gci:
      sections:
        - standard
        - default
        - localmodule
      custom-order: true
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
