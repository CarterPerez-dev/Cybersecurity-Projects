# ci.yml

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: vet
        run: go vet ./...

      - name: module tidiness
        run: go mod tidy -diff

      - name: test
        run: go test -race ./...

      - name: build
        run: go build -o khaos ./cmd/khaos

      - name: color degradation gate
        run: ./scripts/colors.sh

      - name: refusal gate against a real daemon
        run: ./scripts/smoke.sh

      - name: rollback survives kill -9
        run: ./scripts/survive.sh

      - name: the range produces the right verdict both ways
        run: ./scripts/range.sh

      - name: non-tty guard
        run: timeout 15s ./khaos < /dev/null > /dev/null
