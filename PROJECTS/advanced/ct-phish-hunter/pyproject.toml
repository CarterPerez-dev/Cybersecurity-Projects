# pyproject.toml
#
# Project metadata and dependencies for glasswatch, a Certificate
# Transparency phishing hunter. Uses hatchling as the build backend.
# Managed with uv (see CONTRIBUTING.md); pip install -e . also works.

[project]
name = "glasswatch"
version = "0.1.0"
description = "Watch Certificate Transparency logs in real time for brand-impersonating certificates"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }

dependencies = [
    "requests>=2.32.0",
    "cryptography>=43.0.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.scripts]
glasswatch = "glasswatch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["glasswatch"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
