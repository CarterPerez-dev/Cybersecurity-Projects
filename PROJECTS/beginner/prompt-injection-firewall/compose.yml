# compose.yml

name: not-sandboxed-arena

services:
  arena:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: not-sandboxed-arena-api
    image: not-sandboxed-arena-api:latest
    restart: unless-stopped
    networks:
      - arena
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  nginx:
    build:
      context: .
      dockerfile: infra/docker/vite.prod
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
        - VITE_APP_TITLE=${VITE_APP_TITLE:-not-sandboxed arena}
        - VITE_SITE_URL=${VITE_SITE_URL:-}
    container_name: not-sandboxed-arena-nginx
    image: not-sandboxed-arena-nginx:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NS_UI_PORT:-33572}:80"
    depends_on:
      - arena
    networks:
      - arena
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M

networks:
  arena:
    driver: bridge
